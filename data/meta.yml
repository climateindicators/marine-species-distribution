  source_sha256: dc90d5df24aa7fb94f8c1d040152ac68eb95dc64f84603c6e861b5fbc0afe62c
  source_encoding: windows-1252
  data_source: NOAA, 2024
  web_update: June 2024
  unit: miles (average distance moved); feet (average change in depth)
  rows: 288
  columns:
  - name: year
    type: integer
    description: Calendar year of the observation.
  - name: region
    type: string
    description: Survey region (Figure 1 only).
  - name: variable
    type: string
    description: 'Measure: latitude, depth, longitude, or change_in_latitude.'
  - name: value
    type: number
    description: Value of the measure, in the unit given by the unit column, as published
      by EPA.
  - name: unit
    type: string
    description: 'Unit of value: miles, feet, or degrees.'
